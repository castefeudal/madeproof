name: CI
on:
  pull_request:
  push:
    branches: [main, build/madeproof-v0.1]

permissions:
  contents: read

jobs:
  bootstrap-lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/madeproof-v0.1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: build/madeproof-v0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Generate complete npm lockfile
        run: npm install --ignore-scripts --package-lock-only
      - name: Commit only generated lockfile when needed
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m 'chore: finalize npm lockfile'
          git push origin HEAD:build/madeproof-v0.1

  quality:
    runs-on: ubuntu-24.04
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:security
      - run: npm run test:worker
      - run: npm run test:e2e
      - run: npm run test:browser

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: madeproof
          POSTGRES_PASSWORD: madeproof_test_password
          POSTGRES_DB: madeproof_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U madeproof -d madeproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://madeproof:madeproof_test_password@127.0.0.1:5432/madeproof_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run test:postgres

  sandbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --ignore-scripts
      - name: Configure unprivileged user namespaces for Bubblewrap
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm run build
      - name: Execute strong sandbox smoke as the non-root GitHub runner user
        run: node dist/tests/sandbox/strong-sandbox-smoke.js

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.app -t madeproof-api:ci .
      - name: Build worker image
        run: docker build -f infra/docker/Dockerfile.worker -t madeproof-worker:ci .
      - name: Build runner image
        run: docker build -f infra/docker/Dockerfile.runner -t madeproof-runner:ci .
      - name: Assert runner image is non-root and contains sandbox dependencies
        run: |
          test "$(docker image inspect madeproof-runner:ci --format '{{.Config.User}}')" = "node"
          docker run --rm --entrypoint sh madeproof-runner:ci -lc 'test "$(id -u)" -ne 0 && command -v bwrap && command -v chromium && command -v prlimit'
