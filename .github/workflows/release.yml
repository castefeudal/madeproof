name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:unit && npm run test:integration && npm run test:security

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: |
          test -f dist/apps/cli/src/main.js
          test -f dist/apps/mcp/src/main.js
          test -f dist/packages/sdk/src/client.js
          echo "package contents OK"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: MADEPROOF ${{ github.ref_name }}
